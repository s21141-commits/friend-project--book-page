<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책장 펼치기 숫자 대결</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--ink:#3a2a1a;--sub:#8a7560;--a:#ff7a59;--b:#3d9be9;--line:#f0e1c8;--btn:#ffb800;--btnink:#3a2a1a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231a;--ink:#f8ead6;--sub:#b9a48a;--line:#3d3226;--btn:#ffc533;--btnink:#2a1d0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:560px}
h1{font-size:26px;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--sub);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.score{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.pl{flex:1;text-align:center;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.pl.a{border-color:var(--a)}.pl.b{border-color:var(--b)}
.pl .nm{font-weight:700;font-size:16px}
.dots{font-size:22px;letter-spacing:4px;min-height:30px}
.vs{font-weight:800;color:var(--sub)}
.badge{display:inline-block;background:var(--btn);color:var(--btnink);font-weight:800;border-radius:999px;padding:4px 12px;font-size:13px}
.cond{font-size:22px;font-weight:800;margin:10px 0 6px}
.desc{color:var(--sub);font-size:15px;line-height:1.5;margin:0}
.hint{color:var(--sub);font-size:13px;margin:6px 0 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.col{border-radius:16px;padding:12px;border:2px solid var(--line)}
.col.a{border-color:var(--a)}.col.b{border-color:var(--b)}
.col label{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font-size:22px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.pick{display:flex;gap:6px;margin-top:8px}
.pick button{flex:1;padding:10px 0;font-size:16px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.pick button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.bk{border:2px solid var(--line);border-radius:16px;padding:10px;margin-top:12px}
.bk.a{border-color:var(--a)}.bk.b{border-color:var(--b)}
.bksvg{width:100%;height:auto;display:block;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.85) rotateX(35deg);opacity:0}to{transform:none;opacity:1}}
.closed{height:110px;display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--bg);border-radius:12px}
.btn{display:block;width:100%;margin-top:14px;padding:16px;font-size:18px;font-weight:800;border:none;border-radius:16px;background:var(--btn);color:var(--btnink);cursor:pointer}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);font-size:15px;padding:12px}
.msg{color:#e5484d;font-size:14px;margin-top:8px;min-height:18px;text-align:center}
.res{text-align:center}
.res .big{font-size:26px;font-weight:800;margin:6px 0}
.res .det{color:var(--sub);line-height:1.7;font-size:15px}
.queue{display:flex;flex-direction:column;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.queue li{padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.trophy{font-size:64px;text-align:center}
.prize{background:var(--bg);border:2px dashed var(--btn);border-radius:16px;padding:14px;text-align:center;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const digits=n=>[...String(n)].map(Number);
const isSeq=n=>{const d=digits(n);return d.length>=3&&d.every((x,i)=>i===0||x===d[i-1]+1)};
const SEQS=[123,234,345,456,567,678,789];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pk=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const C=[
{k:'sum',t:'각 자리 숫자의 합',d:'오른쪽 쪽수의 각 자리 숫자를 더해서 더 큰 사람이 승리!',type:'page',v:n=>digits(n).reduce((a,b)=>a+b,0),x:n=>digits(n).join('+')+' = '+digits(n).reduce((a,b)=>a+b,0)},
{k:'prod',t:'각 자리 숫자의 곱',d:'오른쪽 쪽수의 각 자리 숫자를 모두 곱해서 더 큰 사람이 승리!',type:'page',v:n=>digits(n).reduce((a,b)=>a*b,1),x:n=>digits(n).join('×')+' = '+digits(n).reduce((a,b)=>a*b,1)},
{k:'one',t:'일의 자리 숫자 대결',d:'오른쪽 쪽수의 일의 자리 숫자가 더 큰 사람이 승리!',type:'page',v:n=>n%10,x:n=>'일의 자리 = '+n%10},
{k:'parity',t:'짝수 vs 홀수 지목 대결',d:'펼치기 전에 “짝수!” 또는 “홀수!”를 고르세요. 고른 대로 오른쪽 쪽수가 나온 사람이 승리!',type:'parity'},
{k:'seven',t:'행운의 숫자 7',d:'오른쪽 쪽수에 숫자 7이 더 많이 들어간 사람이 승리!',type:'page',v:n=>digits(n).filter(x=>x===7).length,x:n=>'7이 '+digits(n).filter(x=>x===7).length+'개'},
{k:'seq',t:'연속된 숫자 쪽수',d:'123쪽, 234쪽처럼 숫자가 이어지는 쪽수(3자리 이상)를 펼치면 즉시 승리!',type:'seq'},
{k:'people',t:'등장하는 사람 수',d:'펼친 두 쪽의 그림 속 모든 사람의 수를 세어 더 많은 사람이 승리!',type:'count',ck:'people',lab:c=>'사람 '+c.people+'명',hint:true},
{k:'nature',t:'동물·식물 많이 찾기',d:'두 쪽에 나온 동물과 나무·꽃이 더 많은 사람이 승리!',type:'count',ck:'nat',lab:c=>'동물·식물 '+c.nat+'개',hint:true},
{k:'acc',t:'안경·모자 쓴 인물 수',d:'안경, 모자, 가방을 착용한 인물이 더 많은 사람이 승리!',type:'count',ck:'acc',lab:c=>'착용 인물 '+c.acc+'명',hint:true}
];
const cond=k=>C.find(c=>c.k===k);

/* ---------- 가상 책 만들기 ---------- */
const SKIN=['#f6d3b3','#e9b98f','#c98f63','#f3c9a5'],SHIRT=['#ff7a59','#3d9be9','#2fb36d','#a678e8','#f2b01e','#e8638f'],HAIR=['#3a2a1a','#6b3f1d','#1f1f1f','#b5651d'];
const ANIM=['🐱','🐶','🐰','🐦','🐻','🦊','🐼','🐸'],FLORA=['🌳','🌲','🌷','🌻','🌼','🌴','🌵'];
function newItem(){
 const r=Math.random();
 if(r<.45){const acc=[];if(Math.random()<.35)acc.push('g');if(Math.random()<.3)acc.push('h');if(Math.random()<.25)acc.push('b');return{t:'p',acc,sk:pk(SKIN),sh:pk(SHIRT),hr:pk(HAIR)}}
 if(r<.72)return{t:'a',e:pk(ANIM)};
 return{t:'f',e:pk(FLORA)}
}
function newPage(){
 const slots=shuffle([[38,36],[102,36],[38,88],[102,88],[38,140],[102,140]]);
 const k=pk([0,1,2,2,3,3,4,5]);
 return{items:slots.slice(0,k).map(s=>({...newItem(),x:s[0],y:s[1]})),empty:slots.slice(k)}
}
function openBook(c){
 let n=rnd(1,1000);
 if(c.k==='seq'&&Math.random()<.2)n=pk(SEQS);
 return{n,L:n>1?newPage():null,R:newPage()}
}
function counts(b){
 const r={people:0,nat:0,acc:0};
 for(const pg of [b.L,b.R]){if(!pg)continue;for(const it of pg.items){if(it.t==='p'){r.people++;if(it.acc.length)r.acc++}else r.nat++}}
 return r
}
function itemSvg(it){
 if(it.t!=='p')return`<text x="${it.x}" y="${it.y}" font-size="36" text-anchor="middle" dominant-baseline="central">${it.e}</text>`;
 let s=`<g transform="translate(${it.x},${it.y-4})">`;
 if(it.acc.includes('b'))s+=`<rect x="11" y="10" width="10" height="14" rx="3" fill="#8a5a2b"/><path d="M-8 8 L14 12" stroke="#8a5a2b" stroke-width="2"/>`;
 s+=`<rect x="-13" y="6" width="26" height="22" rx="8" fill="${it.sh}"/><circle cx="0" cy="-6" r="13" fill="${it.sk}"/><path d="M-13 -7 Q0 -25 13 -7 Q0 -13 -13 -7Z" fill="${it.hr}"/>`;
 s+=`<circle cx="-5" cy="-5" r="1.7" fill="#3a2a1a"/><circle cx="5" cy="-5" r="1.7" fill="#3a2a1a"/><path d="M-4 1 Q0 5 4 1" stroke="#3a2a1a" stroke-width="1.5" fill="none"/>`;
 if(it.acc.includes('g'))s+=`<circle cx="-5" cy="-5" r="4.8" fill="none" stroke="#222" stroke-width="1.6"/><circle cx="5" cy="-5" r="4.8" fill="none" stroke="#222" stroke-width="1.6"/><path d="M-0.5 -5 L0.5 -5" stroke="#222" stroke-width="1.6"/>`;
 if(it.acc.includes('h'))s+=`<ellipse cx="0" cy="-16" rx="17" ry="3.5" fill="#d63c3c"/><path d="M-10 -16 Q0 -35 10 -16Z" fill="#d63c3c"/>`;
 return s+'</g>'
}
function pageSvg(pg,num,x0,right){
 let s=`<g transform="translate(${x0},0)"><rect x="1" y="1" width="138" height="188" rx="6" fill="#fffdf6" stroke="#d9c9a8" stroke-width="2"/>`;
 if(!pg)return s+'</g>';
 for(const e of pg.empty)for(let i=-1;i<=1;i++)s+=`<rect x="${e[0]-28}" y="${e[1]+i*10-2}" width="${i===1?36:56}" height="4" rx="2" fill="#e8dfca"/>`;
 for(const it of pg.items)s+=itemSvg(it);
 return s+`<text x="${right?126:14}" y="182" font-size="14" font-weight="700" fill="#8a7560" text-anchor="${right?'end':'start'}">${num}</text></g>`
}
function bookSvg(b){
 return`<svg class="bksvg" viewBox="0 0 290 190" role="img" aria-label="${b.n}쪽이 펼쳐진 책">${pageSvg(b.L,b.n-1,0,false)}${pageSvg(b.R,b.n,150,true)}<rect x="139" y="0" width="12" height="190" fill="#d9c9a8" opacity=".6"/></svg>`
}

/* ---------- 게임 흐름 ---------- */
const S={names:['친구 1','친구 2'],q:[],i:0,sc:[0,0],used:[],calls:[null,null],books:null,last:null};
const $=s=>document.querySelector(s);
const app=$('#app');
function draw3(){S.q=shuffle(C.map(c=>c.k)).slice(0,3)}
function header(){
 const d=n=>'●'.repeat(S.sc[n])+'○'.repeat(2-S.sc[n]);
 return`<h1>📖 책장 펼치기 숫자 대결</h1><p class="sub">3판 2선승제 · 먼저 2승하면 우승!</p>
 <div class="score"><div class="pl a"><div class="nm">${S.names[0]}</div><div class="dots">${d(0)}</div></div><div class="vs">VS</div><div class="pl b"><div class="nm">${S.names[1]}</div><div class="dots">${d(1)}</div></div></div>`
}
function setup(){
 app.innerHTML=`<h1>📖 책장 펼치기 숫자 대결</h1><p class="sub">1000쪽짜리 마법 책을 동시에 펼쳐 보세요!</p>
 <div class="card"><div class="cols" style="margin-top:0"><div class="col a"><label>선수 1</label><input type="text" id="n0" maxlength="6" value="${S.names[0]==='친구 1'?'':S.names[0]}" placeholder="이름"></div><div class="col b"><label>선수 2</label><input type="text" id="n1" maxlength="6" value="${S.names[1]==='친구 2'?'':S.names[1]}" placeholder="이름"></div></div>
 <p class="desc" style="margin-top:14px">이번 대결 조건 3개가 랜덤으로 뽑혀요.</p><ul class="queue" id="ql"></ul>
 <button class="btn ghost" id="re">🎲 조건 다시 뽑기</button><button class="btn" id="go">대결 시작!</button></div>`;
 const showQ=()=>{$('#ql').innerHTML=S.q.map((k,i)=>`<li><b>${i+1}판</b> · ${cond(k).t}</li>`).join('')};
 if(!S.q.length)draw3();showQ();
 $('#re').onclick=()=>{draw3();showQ()};
 $('#go').onclick=()=>{S.names=[$('#n0').value.trim()||'친구 1',$('#n1').value.trim()||'친구 2'];S.i=0;S.sc=[0,0];S.used=[...S.q];round()};
}
function bkBlock(p,inner){return`<div class="bk ${p?'b':'a'}"><b>${S.names[p]}</b>${inner}</div>`}
function round(){
 S.calls=[null,null];S.books=null;
 const c=cond(S.q[S.i]);
 const blocks=[0,1].map(p=>bkBlock(p,(c.type==='parity'?`<div class="pick"><button data-p="${p}" data-c="짝수">짝수!</button><button data-p="${p}" data-c="홀수">홀수!</button></div>`:'')+`<div id="bk${p}" style="margin-top:8px"><div class="closed">📕</div></div>`)).join('');
 app.innerHTML=header()+`<div class="card"><span class="badge">${S.i+1}번째 판</span><div class="cond">${c.t}</div><p class="desc">${c.d}</p>${c.hint?'<p class="hint">💡 그림을 직접 세어 본 다음 판정을 눌러 확인해요!</p>':''}${blocks}<div class="msg" id="msg"></div><button class="btn" id="act">📖 책 펼치기!</button></div>`;
 document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{if(S.books)return;const p=+b.dataset.p;S.calls[p]=b.dataset.c;document.querySelectorAll(`.pick button[data-p="${p}"]`).forEach(x=>x.classList.toggle('on',x===b))});
 $('#act').onclick=()=>{
  if(S.books)return judge(c);
  if(c.type==='parity'&&S.calls.some(x=>!x))return $('#msg').textContent='둘 다 짝수/홀수를 먼저 골라 주세요!';
  $('#msg').textContent='';
  S.books=[openBook(c),openBook(c)];
  [0,1].forEach(p=>$('#bk'+p).innerHTML=bookSvg(S.books[p]));
  $('#act').textContent='⚖️ 결과 판정!';
 };
}
function judge(c){
 const B=S.books,cn=B.map(counts);
 let w=-1,det=[];
 if(c.type==='page'){const r=B.map(b=>c.v(b.n));det=[0,1].map(p=>`${S.names[p]}: ${B[p].n}쪽 → ${c.x(B[p].n)}`);w=r[0]>r[1]?0:r[1]>r[0]?1:-1}
 else if(c.type==='count'){const r=cn.map(x=>x[c.ck]);det=[0,1].map(p=>`${S.names[p]}: ${B[p].n}쪽 → ${c.lab(cn[p])}`);w=r[0]>r[1]?0:r[1]>r[0]?1:-1}
 else if(c.type==='seq'){const r=B.map(b=>isSeq(b.n));det=[0,1].map(p=>`${S.names[p]}: ${B[p].n}쪽 → ${r[p]?'연속 숫자! ✨':'연속 아님'}`);w=r[0]&&!r[1]?0:r[1]&&!r[0]?1:-1}
 else{const ok=[0,1].map(p=>(B[p].n%2===0?'짝수':'홀수')===S.calls[p]);det=[0,1].map(p=>`${S.names[p]}: ${S.calls[p]} 선택 → ${B[p].n}쪽(${B[p].n%2===0?'짝수':'홀수'}) ${ok[p]?'⭕':'❌'}`);w=ok[0]&&!ok[1]?0:ok[1]&&!ok[0]?1:-1}
 if(w>=0)S.sc[w]++;
 S.last={w,det,B};
 result();
}
function result(){
 const{w,det,B}=S.last;
 const over=S.sc[0]===2||S.sc[1]===2;
 const big=w<0?'🤝 무승부!':`🎉 ${S.names[w]} 승리!`;
 const sub=w<0?'<p class="desc">승부가 나지 않았어요. 새로운 조건으로 다시 해요!</p>':'';
 app.innerHTML=header()+`<div class="card res"><span class="badge">${S.i+1}번째 판 결과</span><div class="big">${big}</div><div class="det">${det.join('<br>')}</div>${sub}
 ${[0,1].map(p=>bkBlock(p,bookSvg(B[p]).replace('class="bksvg"','class="bksvg" style="animation:none;margin-top:8px"'))).join('')}
 <button class="btn" id="nx">${over?'🏆 최종 결과 보기':'다음 판으로 ▶'}</button></div>`;
 $('#nx').onclick=()=>{
  if(over)return final();
  if(w<0){const rest=C.map(c=>c.k).filter(k=>!S.used.includes(k));const pool=rest.length?rest:C.map(c=>c.k).filter(k=>k!==S.q[S.i]);const nk=pk(pool);S.q[S.i]=nk;S.used.push(nk)}
  else S.i=Math.min(S.i+1,2);
  round();
 };
}
function final(){
 const w=S.sc[0]===2?0:1;
 app.innerHTML=header()+`<div class="card res"><div class="trophy">🏆</div><div class="big">${S.names[w]} 최종 우승!</div><div class="det">${S.sc[0]} : ${S.sc[1]}</div>
 <div class="prize">🎁 작은 특권<br>${S.names[1-w]}에게 칭찬 한마디 듣기!</div>
 <button class="btn" id="again">🔄 새 대결 하기</button></div>`;
 $('#again').onclick=()=>{S.q=[];setup()};
}
setup();
</script>
</body>
</html>
